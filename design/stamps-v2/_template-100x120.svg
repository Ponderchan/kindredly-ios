<svg xmlns="http://www.w3.org/2000/svg" xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape" xmlns:sodipodi="http://sodipodi.sourceforge.net/DTD/sodipodi-0.dtd" width="100" height="120" viewBox="0 0 100 120">
  <!--
  KINDREDLY 邮票 v2 · 绘制模板 · 100 × 120 单位（5:6）· 2026-10-16
  ─────────────────────────────────────────────────────────────────
  只在 <g id="art">、<g id="soft">、<g id="xs"> 里画，只用 #FFFFFF。<g id="guides"> 是锁定的参考层，导入脚本会整层删掉。
  · 外框 100×120u。白边 10u。窗口 x 10–90, y 10–110（80×100u，正 4:5）= DIY 裁切框，窗口外的笔画会被裁掉。
  · 安全区 x 18–82, y 18–102（64×84u，窗口各内缩 8u）：所有笔画都要在里面（含线宽）。
  · 图案框：62u 正方形，水平居中，中心 y = 58（x 19–81, y 27–89）。一个关键形状放在这里。
  · 线宽只有一个：4.31u，圆头圆角（stroke-linecap/linejoin round）。不描边、不双线。
  · 关键形状可以是实心白（心、月、叶、旗这类主体）。小点缀放进 <g id="soft">，文件里用 55% 白预览，
    代码里就是 mix(底色, #FFF, 0.55)。soft 层不是必需。
  · 不写字、不用渐变、不用阴影、不用透明度（soft 层的 0.55 除外）、不用蒙版/滤镜/变换。
  · <g id="xs"> 必须有：20×24 用的 XS 剪影，1–2 个粗白形（线 ≥ 8u 长、实心 ≥ 8u 宽高，两形相距 ≥ 6u），
    画在同一个 100×120 框的安全区里；XS 时没有白边，代码只画它。
  · 底色由代码画（36 个 hex 不变），这里的底色只是预览。邮戳会压在票的左下（窗口左 20%）。
  · 导出时删掉 guides 层（或保留 id="guides"，脚本会删）。文件名 = 邮票 id，如 off-chest.svg。
  本文件：母版。示例图案 a-song（白线 4.31u + 两个实心符头）加一个 soft 小星，xs 层用同一组音符，底色 #6B8A20 只是示例。
  导入：node scripts/import-stamp-art.mjs（规则见 design/stamps-v2/README.md）。
  -->
